          example: 3f2b8c1e-5d4a-4e7b-9a10-2c6d8e9f0a1b
      required:
      - id
      - type
      - at
      - listing
      - headline
      - body
      - impact
      - priceMovePct
      - eventId
      - haltId
      description: Never names a trader in WHALE or LIQUIDATION items
    Notification:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 3f2b8c1e-5d4a-4e7b-9a10-2c6d8e9f0a1b
        type:
          type: string
          enum:
          - RUMOR_ABOUT_YOU
          - RULING_ABOUT_YOU
          - HOLDING_MOVED
          - MARGIN_WARNING
          - LIQUIDATED
          - HALT_VOTE
          - ORDER_FILLED
          - SEC_CHARGE
          - PRICE_ALERT
          - BELL
          example: MARGIN_WARNING
        at:
          type: string
          format: date-time
          example: '2026-10-24T13:21:00Z'
        readAt:
          type:
          - string
          - 'null'
          format: date-time
          example: '2026-10-24T13:21:00Z'
        title:
          type: string
          example: Margin warning on your $JAKE short
        body:
          type: string
          example: It liquidates at A$117.00, 4.2% away.
        listingId:
          type:
          - string
          - 'null'
          format: uuid
          example: 3f2b8c1e-5d4a-4e7b-9a10-2c6d8e9f0a1b
        deepLink:
          type: string
          description: aura:// route the app opens
          example: aura://positions/3f2b8c1e-5d4a-4e7b-9a10-2c6d8e9f0a1b
      required:
      - id
      - type
      - at
      - readAt
      - title
      - body
      - listingId
      - deepLink
    NotificationPrefs:
      type: object
      properties:
        holdingMovedPct:
          type: string
          pattern: ^-?\d+\.\d{2}$
          description: Percent units, decimal string, 2 dp (−12.19 = −12.19%)
          example: '5.00'
        quietHours:
          type:
          - object
          - 'null'
          properties:
            start:
              type: string
              example: '23:00'
            end:
              type: string
              example: 07:00
          required:
          - start
          - end
        bells:
          type: boolean
        disabledTypes:
          type: array
          items:
            type: string
    Health:
      type: object
      properties:
        status:
          type: string
          enum:
          - OK
          - DEGRADED
          - MAINTENANCE
          example: OK
        serverTime:
          type: string
          format: date-time
          example: '2026-10-24T13:21:00Z'
        minBuild:
          type: integer
          example: 1
        lastGoodUpdate:
          type:
          - string
          - 'null'
          format: date-time
          example: '2026-10-24T13:21:00Z'
      required:
      - status
      - serverTime
      - minBuild
      - lastGoodUpdate
