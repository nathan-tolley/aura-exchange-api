components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 30
  responses:
    E400:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    E401:
      description: Not signed in or token expired
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    E403:
      description: Not allowed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    E404:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    E409:
      description: Conflict (stale quote, halted, closed, idempotency)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    E422:
      description: Rejected by a game rule
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    E426:
      description: App build too old (UPDATE_REQUIRED)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    E429:
      description: Rate limited
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    E500:
      description: Server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    E503:
      description: Maintenance
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    MarketState:
      type: string
      enum:
