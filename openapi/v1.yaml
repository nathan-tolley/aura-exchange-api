# Aura Exchange v1 contract (draft). Generated by build_openapi.py in the handoff folder; after handoff, edit openapi/v1.yaml in the API repo directly.
openapi: 3.1.0
info:
  title: Aura Exchange API
  version: 1.0.0-draft.1
  description: The v1 contract between the iPhone app and the server. Rules that apply everywhere (money as strings, freshness, errors, statuses,
    realtime, idempotency) are in API-CONTRACT.md. Every operation is tagged x-phase.
servers:
- url: http://localhost:8787/v1
  description: Local API
- url: http://localhost:4010
  description: Prism mock of this file
security:
- bearer: []
tags:
- name: System
- name: Auth
- name: Me
- name: Exchanges
- name: Market data
- name: Trading
- name: Events
- name: Tape
- name: Safety
- name: Realtime
paths:
  /health:
    get:
      summary: Server status and minimum app build
      tags:
      - System
      x-phase: 0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          $ref: '#/components/responses/E503'
        '426':
          $ref: '#/components/responses/E426'
        '500':
          $ref: '#/components/responses/E500'
      security: []
  /auth/email/start:
    post:
      summary: Email a 6-digit sign-in code
      tags:
      - Auth
      x-phase: 0
      responses:
        '204':
          description: Done
        '400':
          $ref: '#/components/responses/E400'
        '429':
          $ref: '#/components/responses/E429'
        '426':
          $ref: '#/components/responses/E426'
        '500':
          $ref: '#/components/responses/E500'
      description: In development the code is printed to the server log instead of emailed.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  example: nathan@example.com
              required:
              - email
      security: []
  /auth/email/verify:
    post:
      summary: Exchange the code for tokens
      tags:
      - Auth
      x-phase: 0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '429':
          $ref: '#/components/responses/E429'
        '426':
          $ref: '#/components/responses/E426'
        '500':
          $ref: '#/components/responses/E500'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                code:
                  type: string
                  pattern: ^\d{6}$
                  example: '482913'
              required:
              - email
              - code
      security: []
  /auth/apple:
    post:
      summary: Sign in with Apple (needs the paid Apple program)
      tags:
      - Auth
      x-phase: later
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '426':
          $ref: '#/components/responses/E426'
        '500':
          $ref: '#/components/responses/E500'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                identityToken:
                  type: string
                displayName:
                  type:
                  - string
                  - 'null'
              required:
              - identityToken
      security: []
  /auth/refresh:
    post:
      summary: Rotate the token pair
      tags:
      - Auth
      x-phase: 0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          $ref: '#/components/responses/E401'
        '426':
          $ref: '#/components/responses/E426'
        '500':
          $ref: '#/components/responses/E500'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
              required:
              - refreshToken
      security: []
  /auth/logout:
    post:
      summary: Revoke this refresh-token family
      tags:
      - Auth
      x-phase: 0
      responses:
        '204':
          description: Done
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '426':
          $ref: '#/components/responses/E426'
        '500':
          $ref: '#/components/responses/E500'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
              required:
              - refreshToken
  /me:
    get:
      summary: You and your memberships
      tags:
      - Me
      x-phase: 0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/E401'
        '426':
          $ref: '#/components/responses/E426'
        '500':
          $ref: '#/components/responses/E500'
    patch:
      summary: Update your display name
      tags:
      - Me
      x-phase: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '426':
          $ref: '#/components/responses/E426'
        '500':
          $ref: '#/components/responses/E500'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName:
                  type: string
                  minLength: 1
                  maxLength: 30
  /me/notifications:
    get:
      summary: Notification inbox (push comes later)
      tags:
      - Me
      x-phase: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Page'
                - type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/Notification'
                  required:
                  - items
        '401':
          $ref: '#/components/responses/E401'
        '426':
          $ref: '#/components/responses/E426'
        '500':
          $ref: '#/components/responses/E500'
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      - name: exchangeId
        in: query
        required: false
        schema:
          type: string
          format: uuid
  /me/notifications/read:
    post:
      summary: Mark notifications read
      tags:
      - Me
      x-phase: 1
      responses:
        '204':
          description: Done
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '426':
          $ref: '#/components/responses/E426'
        '500':
          $ref: '#/components/responses/E500'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items:
                    type: string
                    format: uuid
                    example: 3f2b8c1e-5d4a-4e7b-9a10-2c6d8e9f0a1b
                upTo:
                  type:
                  - string
                  - 'null'
                  format: date-time
                  example: '2026-10-24T13:21:00Z'
  /me/notification-prefs:
    get:
      summary: Notification settings
      tags:
      - Me
      x-phase: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPrefs'
        '401':
          $ref: '#/components/responses/E401'
        '426':
          $ref: '#/components/responses/E426'
        '500':
          $ref: '#/components/responses/E500'
    patch:
      summary: Change notification settings
      tags:
      - Me
      x-phase: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPrefs'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '426':
          $ref: '#/components/responses/E426'
        '500':
          $ref: '#/components/responses/E500'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationPrefs'
  /devices:
    post:
      summary: Register an APNs token
      tags:
      - Me
      x-phase: later
      responses:
        '204':
          description: Done
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '426':
          $ref: '#/components/responses/E426'
        '500':
          $ref: '#/components/responses/E500'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                apnsToken:
                  type: string
                environment:
                  type: string
                  enum:
                  - sandbox
                  - production
                  example: sandbox
              required:
              - apnsToken
              - environment
  /exchanges:
    get:
      summary: Your exchanges
      tags:
      - Exchanges
      x-phase: 0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Exchange'
                required:
                - items
        '401':
          $ref: '#/components/responses/E401'
        '426':
          $ref: '#/components/responses/E426'
        '500':
          $ref: '#/components/responses/E500'
    post:
      summary: Create an exchange (you become its admin)
      tags:
      - Exchanges
      x-phase: 0
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exchange'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '426':
          $ref: '#/components/responses/E426'
        '500':
          $ref: '#/components/responses/E500'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExchangeCreate'
  /exchanges/{exchangeId}:
    get:
      summary: One exchange
      tags:
      - Exchanges
      x-phase: 0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exchange'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '426':
          $ref: '#/components/responses/E426'
        '500':
          $ref: '#/components/responses/E500'
      parameters:
      - name: exchangeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /exchanges/{exchangeId}/settings:
    patch:
      summary: 'Admin: change settings'
      tags:
      - Exchanges
      x-phase: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exchange'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '426':
          $ref: '#/components/responses/E426'
        '500':
          $ref: '#/components/responses/E500'
      parameters:
      - name: exchangeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExchangeSettings'
  /exchanges/{exchangeId}/invites:
    post:
      summary: Create an invite link
      tags:
      - Exchanges
      x-phase: 0
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invite'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '426':
          $ref: '#/components/responses/E426'
        '500':
          $ref: '#/components/responses/E500'
      parameters:
      - name: exchangeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
  /invites/{code}:
    get:
      summary: Preview an invite before joining
      tags:
      - Exchanges
      x-phase: 0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitePreview'
        '404':
          $ref: '#/components/responses/E404'
        '426':
          $ref: '#/components/responses/E426'
        '500':
          $ref: '#/components/responses/E500'
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
  /invites/{code}/accept:
    post:
      summary: Join the exchange
      tags:
      - Exchanges
      x-phase: 0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
        '401':
          $ref: '#/components/responses/E401'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
        '426':
          $ref: '#/components/responses/E426'
        '500':
          $ref: '#/components/responses/E500'
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/IdempotencyKey'
  /exchanges/{exchangeId}/tickers/check:
    get:
      summary: Is a ticker free?
      tags:
      - Exchanges
      x-phase: 0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TickerCheck'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '426':
          $ref: '#/components/responses/E426'
        '500':
          $ref: '#/components/responses/E500'
      parameters:
      - name: exchangeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: ticker
        in: query
        required: true
        schema:
          type: string
  /exchanges/{exchangeId}/listing:
    post:
      summary: 'Your IPO: consent and pick a ticker'
      tags:
      - Exchanges
      x-phase: 0
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingRef'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '409':
          $ref: '#/components/responses/E409'
        '426':
          $ref: '#/components/responses/E426'
        '500':
          $ref: '#/components/responses/E500'
      parameters:
      - name: exchangeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IpoRequest'
    delete:
      summary: 'Opt out: delist yourself (holders cashed out at last price)'
      tags:
      - Exchanges
      x-phase: 1
      responses:
        '204':
          description: Done
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '426':
          $ref: '#/components/responses/E426'
        '500':
          $ref: '#/components/responses/E500'
      parameters:
      - name: exchangeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
  /exchanges/{exchangeId}/fed:
    post:
      summary: 'Admin: set borrow rate / allowance (writes a Fed statement)'
      tags:
      - Exchanges
      x-phase: 2
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TapeItem'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '426':
          $ref: '#/components/responses/E426'
        '500':
          $ref: '#/components/responses/E500'
      parameters:
      - name: exchangeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                borrowRateDailyPct:
                  type: string
                  pattern: ^-?\d+\.\d{2}$
                  description: Percent units, decimal string, 2 dp (−12.19 = −12.19%)
                  example: '0.10'
                allowance:
                  type: string
                  pattern: ^-?\d+\.\d{2}$
                  description: Aura Bucks, decimal string, 2 dp
                  example: '1000.00'
  /exchanges/{exchangeId}/market:
    get:
      summary: Every listing with price and today's sparkline
      tags:
      - Market data
      x-phase: 0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Market'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '426':
          $ref: '#/components/responses/E426'
        '500':
          $ref: '#/components/responses/E500'
      parameters:
      - name: exchangeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /listings/{listingId}:
    get:
      summary: Stock page
      tags:
      - Market data
      x-phase: 0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingDetail'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '426':
          $ref: '#/components/responses/E426'
        '500':
          $ref: '#/components/responses/E500'
      parameters:
      - name: listingId
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /listings/{listingId}/candles:
    get:
      summary: Chart data with event markers
      tags:
      - Market data
      x-phase: 0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandleSeries'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '426':
          $ref: '#/components/responses/E426'
        '500':
          $ref: '#/components/responses/E500'
      parameters:
      - name: listingId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: range
        in: query
        required: false
        schema:
          type: string
          enum:
          - 1D
          - 1W
          - 1M
          - SEASON
          default: 1D
  /exchanges/{exchangeId}/index/candles:
    get:
      summary: Aura Composite chart
      tags:
      - Market data
      x-phase: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandleSeries'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '426':
          $ref: '#/components/responses/E426'
        '500':
          $ref: '#/components/responses/E500'
      parameters:
      - name: exchangeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: range
        in: query
        required: false
        schema:
          type: string
          enum:
          - 1D
          - 1W
          - 1M
          - SEASON
          default: 1D
  /quotes:
    post:
      summary: Price a market order (holds 15 s)
      tags:
      - Trading
      x-phase: 0
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '409':
          $ref: '#/components/responses/E409'
        '422':
          $ref: '#/components/responses/E422'
        '426':
          $ref: '#/components/responses/E426'
        '500':
          $ref: '#/components/responses/E500'
      description: Validation that would reject the trade (cash, size, short cap, closed, halted) happens here too, so the sheet can explain it
        before the slide.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteRequest'
  /trades:
    post:
      summary: Execute a quote
      tags:
      - Trading
      x-phase: 0
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trade'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '409':
          $ref: '#/components/responses/E409'
        '422':
          $ref: '#/components/responses/E422'
        '426':
          $ref: '#/components/responses/E426'
        '500':
          $ref: '#/components/responses/E500'
