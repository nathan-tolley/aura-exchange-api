name: aura-exchange
services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-http://localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 8787
      DATABASE_URL: postgres://aura:${POSTGRES_PASSWORD}@postgres:5432/aura_exchange
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost}
      CHATGPT_CALLBACK_URL: http://127.0.0.1:1455/auth/callback
    ports:
      - "127.0.0.1:1455:8787"
    volumes:
      - uploads:/app/uploads
      - ./backups:/app/backups
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: .
    restart: unless-stopped
    command: ["node", "dist-api/src/worker.js"]
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://aura:${POSTGRES_PASSWORD}@postgres:5432/aura_exchange
    volumes:
      - ./backups:/app/backups
    depends_on:
      app:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: aura_exchange
      POSTGRES_USER: aura
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aura -d aura_exchange"]
      interval: 5s
      timeout: 5s
      retries: 15

volumes:
  postgres_data:
  uploads:
  caddy_data:
  caddy_config:

